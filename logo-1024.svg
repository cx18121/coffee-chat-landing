<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: brand periwinkle -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6560B8"/>
      <stop offset="100%" stop-color="#8B87CC"/>
    </linearGradient>
    <!-- Subtle radial overlay for depth -->
    <radialGradient id="glow" cx="40%" cy="38%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub circle inner glow -->
    <filter id="hubShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#3D3A8A" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#3D3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>
  <!-- Depth overlay -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Connection lines (drawn under circles) -->
  <!-- Hub edge to top-right node -->
  <line
    x1="466" y1="512"
    x2="590" y2="406"
    stroke="white"
    stroke-width="34"
    stroke-linecap="round"
    opacity="0.55"
  />
  <!-- Hub edge to bottom-right node -->
  <line
    x1="466" y1="512"
    x2="590" y2="618"
    stroke="white"
    stroke-width="34"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Hub node (large, left) -->
  <circle cx="371" cy="512" r="104" fill="white" opacity="0.95" filter="url(#hubShadow)"/>

  <!-- Top-right node -->
  <circle cx="656" cy="371" r="72" fill="white" opacity="0.88" filter="url(#nodeShadow)"/>

  <!-- Bottom-right node -->
  <circle cx="656" cy="653" r="72" fill="white" opacity="0.88" filter="url(#nodeShadow)"/>
</svg>
